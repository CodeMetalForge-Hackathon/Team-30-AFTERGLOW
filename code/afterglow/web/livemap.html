<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFTERGLOW · live map</title>
<link rel="stylesheet" href="vendor/maplibre-gl-4.7.1/maplibre-gl.css">
<script src="vendor/maplibre-gl-4.7.1/maplibre-gl.js"></script>
<style>html,body{margin:0;height:100%;background:#1a2433}#livemap{position:fixed;inset:0}
.boot{color:#9aabc2;font:14px system-ui;padding:40px;text-align:center}</style>
</head>
<body>
<!-- The live map feed on its own. Embed it in any page with
     <iframe src="/livemap.html" style="width:100%;height:600px;border:0"></iframe>
     Options in the URL: ?key=0 (hide the key), ?key=open or ?key=closed &tools=0 &status=0 &labels=0 &follow=1 (camera follows the pod).
     See docs/LIVEMAP.md. -->
<div id="livemap"></div>
<script type="module">
  import { mountLiveMap } from './livemap.js';
  const q = new URLSearchParams(location.search);
  const flag = (k, d) => (q.has(k) ? q.get(k) !== '0' : d);
  mountLiveMap(document.getElementById('livemap'), {
    key: ['open', 'closed'].includes(q.get('key')) ? q.get('key') : flag('key', true), tools: flag('tools', true), status: flag('status', true),
    labels: flag('labels', true), follow: flag('follow', false),
  }).catch((e) => {
    document.body.innerHTML = `<div class="boot">Can't reach the dashboard server: ${String(e).replace(/</g, '&lt;')}.<br>
      Start it with <code>python -m afterglow.dashboard</code> or <code>python tools/local_stack.py</code>.</div>`;
  });
</script>
</body>
</html>
