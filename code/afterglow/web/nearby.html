<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFTERGLOW · nearby</title>
<link rel="icon" href="data:,">
<!-- Close-range view: the pod in the middle, every Bluetooth and Wi-Fi signal heard in the last few seconds
     around it, distance from RSSI through the tracker's model (/api/map "rssi"). The pod's antennas are
     omnidirectional, so the angle only spreads the dots out: it is not a direction.
     Read-only: nothing here publishes ag/ctrl or ag/mode.
     URL options: ?m=5 (edge in metres), ?s=10 (drop a signal not heard for this long), ?demo=1 (fake signals, no server data).
     Embed: <iframe src="/nearby.html" style="width:100%;height:600px;border:0"></iframe> -->
<style>
@font-face { font-family: 'IBM Plex Sans'; font-weight: 400; src: url(vendor/ibm-plex/ibm-plex-sans-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-weight: 600; src: url(vendor/ibm-plex/ibm-plex-sans-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 400; src: url(vendor/ibm-plex/ibm-plex-mono-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url(vendor/ibm-plex/ibm-plex-mono-latin-500-normal.woff2) format('woff2'); }
:root {
  --bg: #0a0c0e; --surface: #0f1215; --raised: #151a1e; --hair: #1f252b; --hair-2: #2b333a;
  --text: #e4e7ea; --text-2: #a0a8b0; --text-3: #6c757e;
  --brand: #f0a63a; --ok: #3fb68b; --crit: #e5484d; --info: #4da3ff;
  --findmy: #e5484d; --findhub: #f76b15; --samsung: #f5c13d; --ref: #4da3ff;
  --apple: #8b95a3; --other: #5d666f; --wifi: #4fb8c4;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 var(--sans);
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.app { display: grid; grid-template: auto 1fr / 1fr minmax(320px, 380px); height: 100%; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 10px 16px;
  border-bottom: 1px solid var(--hair); background: var(--surface); }
header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
header h1 b { color: var(--brand); font-weight: 600; }
.badge { font: 500 11px var(--mono); padding: 2px 7px; border-radius: 3px; border: 1px solid var(--hair-2); color: var(--text-2); }
.badge.live { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
.badge.demo, .badge.sim, .badge.replay { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 50%, transparent); }
.badge.down { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 50%, transparent); }
header .spacer { flex: 1; }
header .scale { font: 12px var(--mono); color: var(--text-3); }

.stage { position: relative; display: grid; place-items: center; min-height: 0; overflow: hidden; padding: 12px; }
#radar { width: 100%; height: 100%; max-height: calc(100vh - 110px); }
.note { position: absolute; left: 16px; bottom: 12px; right: 16px; color: var(--text-3); font-size: 12px; }
.legend { position: absolute; left: 16px; top: 12px; display: grid; gap: 4px; font-size: 12px; color: var(--text-2); }
.legend span { display: flex; align-items: center; gap: 7px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; }
.legend i.sq { border-radius: 1px; transform: rotate(45deg) scale(.85); }

.ring { fill: none; stroke: var(--hair-2); stroke-width: .5; }
.ring.edge { stroke: var(--text-3); stroke-width: .8; }
.ring-label { fill: var(--text-3); font: 4.2px var(--mono); }
.spoke { stroke: var(--hair); stroke-width: .4; }
.ping { fill: none; stroke: var(--info); stroke-width: .6; transform-box: fill-box; transform-origin: center;
  animation: ping 3s ease-out infinite; }
@keyframes ping { from { transform: scale(.15); opacity: .7; } to { transform: scale(1); opacity: 0; } }
.selring { fill: none; stroke: var(--text); stroke-width: .6; stroke-dasharray: 2 2; opacity: 0; transition: r .4s, opacity .2s; }
.selring.on { opacity: .7; }

.sig { transition: transform .45s ease-out, opacity .45s; cursor: pointer; }
.sig .core { fill: var(--c); stroke: var(--bg); stroke-width: .6; }
.sig .halo { fill: var(--c); opacity: .25; transform-box: fill-box; transform-origin: center; animation: halo 1.6s ease-out infinite; }
@keyframes halo { from { transform: scale(.6); opacity: .45; } to { transform: scale(2.2); opacity: 0; } }
.sig text { fill: var(--text); font: 500 4.6px var(--mono); paint-order: stroke; stroke: var(--bg); stroke-width: 1.4px; }
.sig.hot .core, .sig.sel .core { stroke: var(--text); stroke-width: .9; }

.drone .arm { stroke: var(--text-2); stroke-width: 1.6; stroke-linecap: round; }
.drone .rotor { fill: var(--raised); stroke: var(--info); stroke-width: .8; }
.drone .body { fill: var(--info); }

aside { border-left: 1px solid var(--hair); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.nearest { padding: 14px 16px; border-bottom: 1px solid var(--hair); }
.nearest .k { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }
.nearest .v { font: 600 28px var(--mono); margin-top: 2px; }
.nearest .v small { font: 400 13px var(--sans); color: var(--text-2); margin-left: 6px; }
.nearest .t { font-size: 13px; color: var(--text-2); }
.nearest .trend.up { color: var(--ok); } .nearest .trend.down { color: var(--crit); }
.list { overflow-y: auto; flex: 1; }
.sec { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 6px;
  font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }
.sec button { background: none; border: 1px solid var(--hair-2); color: var(--text-2); border-radius: 3px;
  font: 11px var(--sans); padding: 2px 7px; cursor: pointer; text-transform: none; letter-spacing: 0; }
.row { display: grid; grid-template-columns: 4px 1fr auto; gap: 10px; padding: 8px 16px 8px 12px; cursor: pointer;
  border-top: 1px solid var(--hair); }
.row:hover, .row.hot { background: var(--raised); }
.row.sel { background: color-mix(in srgb, var(--raised) 70%, var(--c) 12%); }
.row .bar { background: var(--c); border-radius: 2px; }
.row .name { font-weight: 600; }
.row .what { font-size: 12px; color: var(--text-2); }
.row .id { font: 11px var(--mono); color: var(--text-3); }
.row .num { text-align: right; font-family: var(--mono); }
.row .d { font-size: 15px; font-weight: 500; }
.row .r { font-size: 11px; color: var(--text-3); }
.row.quiet .name { font-weight: 400; color: var(--text-2); }
.empty { padding: 10px 16px 14px; color: var(--text-3); font-size: 13px; }
.foot { padding: 8px 16px; border-top: 1px solid var(--hair); font-size: 12px; color: var(--text-3); }

@media (max-width: 760px) {
  .app { grid-template: auto minmax(320px, 55vh) 1fr / 1fr; height: auto; min-height: 100%; }
  aside { border-left: 0; border-top: 1px solid var(--hair); }
  .legend, header .scale { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><b>AFTERGLOW</b> · Nearby signals</h1>
    <span class="badge" id="badge">…</span>
    <span class="spacer"></span>
    <span class="scale" id="scale"></span>
  </header>
  <div class="stage">
    <svg id="radar" viewBox="-125 -125 250 250" role="img" aria-label="Signals around the pod">
      <defs>
        <radialGradient id="bgfill"><stop offset="0" stop-color="#121820"/><stop offset="1" stop-color="#0b0e11"/></radialGradient>
      </defs>
      <circle r="100" fill="url(#bgfill)"/>
      <g id="grid"></g>
      <circle class="ping" r="100"/>
      <circle class="selring" id="selring" r="0"/>
      <g id="dots"></g>
      <g class="drone" aria-label="pod">
        <line class="arm" x1="-8" y1="-8" x2="8" y2="8"/><line class="arm" x1="8" y1="-8" x2="-8" y2="8"/>
        <circle class="rotor" cx="-8" cy="-8" r="4.2"/><circle class="rotor" cx="8" cy="-8" r="4.2"/>
        <circle class="rotor" cx="-8" cy="8" r="4.2"/><circle class="rotor" cx="8" cy="8" r="4.2"/>
        <rect class="body" x="-3.6" y="-4.6" width="7.2" height="9.2" rx="1.6"/>
      </g>
    </svg>
    <div class="legend" id="legend"></div>
    <div class="note">Distance comes from signal strength only, so it's rough (±40%). The pod can't tell direction:
      the angle just spreads the dots out. Click a dot or a row to show its distance ring.</div>
  </div>
  <aside>
    <div class="nearest" id="nearest"></div>
    <div class="list" id="list"></div>
    <div class="foot" id="foot"></div>
  </aside>
</div>
<script type="module">
import { connect, emptyState } from './store.js';

const q = new URLSearchParams(location.search);
const MAX_M = Math.max(1, +q.get('m') || 5);       // the edge of the view, in metres
const WINDOW_S = Math.max(2, +q.get('s') || 10);   // a signal not heard for this long drops off
const DEMO = q.get('demo') === '1';
const R0 = 16, R1 = 100;                            // svg radius of 0 m (the pod's body) and of the edge
let model = { p0: -48, n: 2.4 };                    // replaced by /api/map

// What each beacon type is. alert: the kinds a lost or switched-off phone sends (the ones the tracker pins).
const KINDS = {
  findmy:      { name: 'Find My beacon',    short: 'Find My', what: 'iPhone or AirTag away from its owner (lost, dead or off)', c: '--findmy', alert: true },
  findhub:     { name: 'Find Hub tag',      short: 'Find Hub', what: 'Android phone or tag in offline finding', c: '--findhub', alert: true },
  samsung_off: { name: 'Samsung lost mode', short: 'Samsung', what: 'Samsung phone or tag in lost mode', c: '--samsung', alert: true },
  ref:         { name: 'Reference beacon',  what: "Ours, for testing", c: '--ref' },
  apple_other: { name: 'Apple device',      what: 'Live iPhone, Watch or AirPods near their owner', c: '--apple' },
  other:       { name: 'Other Bluetooth',   what: 'Headphones, watches, cars, anything else', c: '--other' },
  wifi_rand:   { name: 'Wi-Fi probe',       what: 'A phone looking for networks (random address)', c: '--wifi', wifi: true },
  wifi:        { name: 'Wi-Fi device',      what: 'Fixed-address Wi-Fi device', c: '--wifi', wifi: true },
};
const kindOf = (o, rand) => (o.kind === 'wifi' ? (rand[o.id] === false ? 'wifi' : 'wifi_rand') : (KINDS[o.cls] ? o.cls : 'other'));

const metres = (rssi) => 10 ** ((model.p0 - rssi) / (10 * model.n));
const rssiAt = (m) => model.p0 - 10 * model.n * Math.log10(m);
const rpx = (m) => R0 + (R1 - R0) * Math.min(m, MAX_M) / MAX_M;
const angle = (id) => { let h = 2166136261; for (const ch of String(id)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return ((h >>> 0) / 2 ** 32) * 2 * Math.PI; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const $ = (id) => document.getElementById(id);
const SVG = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}) => { const e = document.createElementNS(SVG, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

function drawGrid() {
  const g = $('grid'); g.replaceChildren();
  for (let a = 0; a < 4; a++) {
    const t = a * Math.PI / 4;
    g.append(el('line', { class: 'spoke', x1: -R1 * Math.cos(t), y1: -R1 * Math.sin(t), x2: R1 * Math.cos(t), y2: R1 * Math.sin(t) }));
  }
  const step = MAX_M <= 6 ? 1 : MAX_M <= 15 ? 2.5 : 5;
  for (let m = step; m <= MAX_M + 1e-9; m += step) {
    const edge = Math.abs(m - MAX_M) < 1e-9;
    g.append(el('circle', { class: 'ring' + (edge ? ' edge' : ''), r: rpx(m) }));
    const lab = el('text', { class: 'ring-label', x: 2, y: -rpx(m) - 1.5 });
    lab.textContent = edge ? `${m} m · ${Math.round(rssiAt(m))} dBm` : `${m} m`;
    g.append(lab);
  }
  $('scale').textContent = `edge ${MAX_M} m ≈ ${Math.round(rssiAt(MAX_M))} dBm · 1 m = ${model.p0} dBm · n ${model.n}`;
  $('legend').innerHTML = ['findmy', 'findhub', 'samsung_off', 'apple_other', 'other', 'wifi_rand']
    .map((k) => `<span><i class="${KINDS[k].wifi ? 'sq' : ''}" style="--c:var(${KINDS[k].c})"></i>${KINDS[k].name}</span>`).join('');
}

// Per-id smoothing (RSSI jumps a few dB between packets) and a 4 s history for the warmer/colder arrow.
const smooth = {};
function smoothed(o) {
  let s = smooth[o.id];
  if (!s) s = smooth[o.id] = { n: -1, rssi: o.rssi, hist: [] };
  if (s.n !== o.n) {
    s.n = o.n;
    s.rssi = s.rssi * 0.6 + o.rssi * 0.4;
    s.hist.push([o.t, s.rssi]);
    while (s.hist.length > 1 && o.t - s.hist[0][0] > 4000) s.hist.shift();
  }
  return s;
}

let sel = null, hot = null, showOthers = true;
const rand = {};   // id -> Wi-Fi rand flag (the summary drops it; obs_log has it)

function collect(state) {
  for (const { topic, msg } of state.obs_log || []) if (topic === 'ag/obs/wifi' && msg.id) rand[msg.id] = msg.rand;
  const now = state.bus_t || Date.now();
  const near = [];
  let farther = 0;
  for (const o of Object.values(state.obs || {})) {
    if (typeof o.rssi !== 'number' || typeof o.t !== 'number') continue;
    const age = Math.max(0, (now - o.t) / 1000);
    if (age > WINDOW_S) { delete smooth[o.id]; continue; }
    const s = smoothed(o);
    const m = metres(s.rssi);
    if (m > MAX_M) { farther++; continue; }
    const k = kindOf(o, rand);
    const h = s.hist, trend = h.length > 1 ? h[h.length - 1][1] - h[0][1] : 0;
    near.push({ id: o.id, k, kind: KINDS[k], m, rssi: s.rssi, age, n: o.n, trend });
  }
  near.sort((a, b) => (b.kind.alert ? 1 : 0) - (a.kind.alert ? 1 : 0) || a.m - b.m);
  return { near, farther };
}

function drawDots(near) {
  const g = $('dots'), seen = new Set();
  for (const s of near) {
    seen.add(s.id);
    let e = g.querySelector(`[data-id="${CSS.escape(s.id)}"]`);
    if (!e) {
      e = el('g', { class: 'sig', 'data-id': s.id });
      if (s.kind.alert) e.append(el('circle', { class: 'halo', r: 5 }));
      e.append(s.kind.wifi ? el('rect', { class: 'core', x: -2.4, y: -2.4, width: 4.8, height: 4.8, transform: 'rotate(45)' })
                           : el('circle', { class: 'core', r: s.kind.alert ? 4 : 2.6 }));
      // the label sits on the side away from the pod, so it never covers the drone
      if (s.kind.alert) e.append(Math.sin(angle(s.id)) < 0 ? el('text', { x: -6.5, y: 1.6, 'text-anchor': 'end' }) : el('text', { x: 6.5, y: 1.6 }));
      e.style.opacity = 0;
      g.append(e);
    }
    const a = angle(s.id), r = rpx(s.m);
    e.style.setProperty('--c', `var(${s.kind.c})`);
    e.style.transform = `translate(${(Math.sin(a) * r).toFixed(1)}px, ${(-Math.cos(a) * r).toFixed(1)}px)`;
    e.style.opacity = s.age < 2 ? 1 : Math.max(0.25, 1 - (s.age - 2) / (WINDOW_S - 2));
    e.classList.toggle('sel', s.id === sel);
    e.classList.toggle('hot', s.id === hot);
    const t = e.querySelector('text');
    if (t) t.textContent = `${s.kind.short} ${s.m.toFixed(1)} m`;
  }
  for (const e of [...g.children]) if (!seen.has(e.dataset.id)) e.remove();
  const sr = $('selring'), selSig = near.find((s) => s.id === sel);
  sr.classList.toggle('on', !!selSig);
  if (selSig) sr.setAttribute('r', rpx(selSig.m));
}

function row(s) {
  const arrow = s.trend > 3 ? ' ↑' : s.trend < -3 ? ' ↓' : '';
  return `<div class="row${s.kind.alert ? '' : ' quiet'}${s.id === sel ? ' sel' : ''}${s.id === hot ? ' hot' : ''}" data-id="${esc(s.id)}" style="--c:var(${s.kind.c})">
    <span class="bar"></span>
    <div><div class="name">${s.kind.name}</div><div class="what">${s.kind.what}</div><div class="id">${esc(s.id)} · heard ×${s.n}</div></div>
    <div class="num"><div class="d">≈${s.m.toFixed(1)} m${arrow}</div><div class="r">${Math.round(s.rssi)} dBm · ${s.age < 1 ? 'now' : Math.round(s.age) + ' s'}</div></div>
  </div>`;
}

function drawSide(near, farther, total) {
  const alerts = near.filter((s) => s.kind.alert), rest = near.filter((s) => !s.kind.alert);
  const best = alerts[0];
  $('nearest').innerHTML = best
    ? `<div class="k">Nearest lost-device beacon</div>
       <div class="v" style="color:var(${best.kind.c})">≈${best.m.toFixed(1)} m<small>${best.kind.name}</small></div>
       <div class="t">${Math.round(best.rssi)} dBm ·
         <span class="trend ${best.trend > 3 ? 'up' : best.trend < -3 ? 'down' : ''}">${best.trend > 3 ? 'getting closer' : best.trend < -3 ? 'getting farther' : 'steady'}</span></div>`
    : `<div class="k">Nearest lost-device beacon</div><div class="v" style="color:var(--text-3)">none<small>within ${MAX_M} m</small></div>`;
  $('list').innerHTML =
    `<div class="sec"><span>Alerts · ${alerts.length}</span></div>` +
    (alerts.length ? alerts.map(row).join('') : `<div class="empty">No Find My, Find Hub or Samsung lost-mode beacon within ${MAX_M} m.</div>`) +
    `<div class="sec"><span>Other signals · ${rest.length}</span><button id="tog">${showOthers ? 'Hide' : 'Show'}</button></div>` +
    (showOthers ? rest.map(row).join('') : '');
  $('foot').textContent = `${farther} more heard farther than ${MAX_M} m · ${total} ids in the last ${WINDOW_S} s`;
}

function render(state, linkLabel, linkCls) {
  const { near, farther } = collect(state);
  if (sel && !near.some((s) => s.id === sel)) sel = null;
  drawDots(near);
  drawSide(near, farther, near.length + farther);
  const b = $('badge'); b.textContent = linkLabel; b.className = 'badge ' + linkCls;
}

// Clicks and hovers (rows are redrawn 4 times a second, so these are delegated).
$('list').addEventListener('click', (e) => {
  if (e.target.id === 'tog') { showOthers = !showOthers; return; }
  const r = e.target.closest('.row'); if (r) sel = sel === r.dataset.id ? null : r.dataset.id;
});
$('list').addEventListener('mouseover', (e) => { hot = e.target.closest('.row')?.dataset.id ?? null; });
$('list').addEventListener('mouseleave', () => { hot = null; });
$('dots').addEventListener('click', (e) => { const g = e.target.closest('.sig'); if (g) sel = sel === g.dataset.id ? null : g.dataset.id; });

if (DEMO) {
  // Fake signals only (?demo=1): a few beacons drifting about, some past the edge. Never mixed with real data.
  drawGrid();
  const state = emptyState();
  const fakes = [
    ['findmy', 1.6], ['findmy', 4.2], ['findhub', 3.1], ['samsung_off', 6.5], ['apple_other', 2.2], ['apple_other', 3.8],
    ['apple_other', 7], ['other', 4.6], ['other', 1.1], ['wifi', 2.7], ['wifi', 4.9], ['wifi', 9], ['ref', 0.6],
  ].map(([cls, d], i) => ({ id: (0x1a2b3c4d * (i + 7) >>> 0).toString(16).padStart(8, '0').slice(-8), cls, d, rate: cls === 'apple_other' ? 0.9 : 0.5 }));
  setInterval(() => {
    const t = Date.now(); state.bus_t = t;
    for (const f of fakes) {
      f.d = Math.min(10, Math.max(0.4, f.d + (Math.random() - 0.5) * 0.25 + (f.id === fakes[0].id ? -0.03 : 0)));
      if (f.id === fakes[0].id && f.d < 0.5) f.d = 4.5;   // the first Find My walks in, then starts over
      if (Math.random() > f.rate) continue;
      const rssi = Math.round(model.p0 - 10 * model.n * Math.log10(f.d) + (Math.random() - 0.5) * 6);
      const wifi = f.cls === 'wifi';
      const o = state.obs[f.id] ||= { id: f.id, n: 0, first: t, best: -999 };
      Object.assign(o, { kind: wifi ? 'wifi' : 'ble', cls: f.cls, rssi, t, n: o.n + 1 });
      if (wifi) rand[f.id] = f.d < 4;
    }
    render(state, 'DEMO DATA', 'demo');
  }, 250);
} else {
  fetch('/api/map').then((r) => r.json()).then((meta) => { if (meta.rssi) model = meta.rssi; }).catch(() => {}).finally(drawGrid);
  const store = connect({ trailStep: 1, onChange: () => {} });
  setInterval(() => {
    const s = store.state, src = Object.values(s.poses || {})[0]?.src;
    const label = store.link !== 'live' ? store.link.toUpperCase() : !s.broker ? 'NO BROKER'
      : src === 'sim' ? 'SIMULATED' : src === 'replay' ? 'REPLAY' : 'LIVE';
    render(s, label, store.link !== 'live' || !s.broker ? 'down' : src === 'sim' ? 'sim' : src === 'replay' ? 'replay' : 'live');
  }, 250);
}
</script>
</body>
</html>
